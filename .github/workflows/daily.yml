name: Daily Finance News Bot


on:

  # 每天北京时间 07:30
  # GitHub Actions 使用 UTC
  # 北京时间 = UTC+8
  # 所以设置 23:30 UTC

  schedule:

    - cron: "30 23 * * *"


  # 支持手动测试

  workflow_dispatch:



jobs:


  finance-news:


    runs-on: ubuntu-latest



    steps:


      # 拉取代码

      - name: Checkout

        uses: actions/checkout@v4



      # Python环境

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      # 安装依赖

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt



      # 运行机器人

      - name: Run Finance News Bot

        env:


          VOLC_API_KEY:

            ${{ secrets.VOLC_API_KEY }}


          VOLC_MODEL:

            ${{ secrets.VOLC_MODEL }}


          FEISHU_WEBHOOK:

            ${{ secrets.FEISHU_WEBHOOK }}


          FEISHU_SECRET:

            ${{ secrets.FEISHU_SECRET }}


        run: |

          python main.py
